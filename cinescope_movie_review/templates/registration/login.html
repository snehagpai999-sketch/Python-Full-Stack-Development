{% extends "base.html" %}
{% block title %}Login | CineScope{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Continue discovering great stories.</p>
<form method="post" class="stack-form">{% csrf_token %}
{% if form.errors %}<div class="form-error">Username or password is incorrect.</div>{% endif %}
<label>Username{{ form.username }}</label><label>Password{{ form.password }}</label>
<input type="hidden" name="next" value="{{ next }}">
<button class="primary-btn full">Login</button>
</form><p class="auth-foot">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div>
{% endblock %}
